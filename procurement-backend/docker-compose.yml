services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: procure
      POSTGRES_PASSWORD: procure
      POSTGRES_DB: procure
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procure"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://procure:procure@db:5432/procure
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
    volumes: [uploads:/app/uploads]
volumes:
  pgdata:
  uploads:
